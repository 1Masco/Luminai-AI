
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lumina — AI Meeting Intelligence</title>
    <meta name="description" content="Lumina captures, transcribes, and summarizes your meetings with AI. Never miss an insight again.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                300: '#a5b4fc',
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                800: '#3730a3',
                900: '#312e81',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'shimmer': 'shimmer 2s linear infinite',
              'slide-up': 'slideUp 0.5s ease-out',
              'slide-down': 'slideDown 0.3s ease-out',
              'fade-in': 'fadeIn 0.4s ease-out',
              'scale-in': 'scaleIn 0.3s ease-out',
              'pulse-ring': 'pulseRing 2s ease-out infinite',
              'gradient-shift': 'gradientShift 8s ease infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideDown: {
                '0%': { opacity: '0', transform: 'translateY(-8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              pulseRing: {
                '0%': { transform: 'scale(0.95)', opacity: '1' },
                '100%': { transform: 'scale(1.8)', opacity: '0' },
              },
              gradientShift: {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              glow: {
                '0%': { boxShadow: '0 0 20px rgba(99, 102, 241, 0.15)' },
                '100%': { boxShadow: '0 0 30px rgba(99, 102, 241, 0.3)' },
              },
            },
          }
        }
      }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        /* ── Theme CSS Variables ── */
        :root {
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
            /* Light theme */
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --card-bg: #ffffff;
            --sidebar-bg: rgba(255, 255, 255, 0.80);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --text-inverted: #ffffff;
            --border-primary: rgba(226, 232, 240, 0.6);
            --border-secondary: #e2e8f0;
            --hover-bg: #f8fafc;
            --input-bg: transparent;
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.4);
            --scrollbar-thumb: rgba(0, 0, 0, 0.1);
            --scrollbar-hover: rgba(0, 0, 0, 0.2);
            --shadow-color: rgba(0, 0, 0, 0.05);
            --overlay-bg: rgba(0, 0, 0, 0.5);
        }

        html.dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --card-bg: #1e293b;
            --sidebar-bg: rgba(15, 23, 42, 0.92);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --text-inverted: #0f172a;
            --border-primary: rgba(51, 65, 85, 0.6);
            --border-secondary: #334155;
            --hover-bg: #334155;
            --input-bg: rgba(30, 41, 59, 0.5);
            --glass-bg: rgba(15, 23, 42, 0.80);
            --glass-border: rgba(51, 65, 85, 0.4);
            --scrollbar-thumb: rgba(255, 255, 255, 0.1);
            --scrollbar-hover: rgba(255, 255, 255, 0.2);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --overlay-bg: rgba(0, 0, 0, 0.7);
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .pb-safe {
            padding-bottom: var(--safe-area-inset-bottom, 0px);
        }

        /* Premium scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-hover);
        }
        /* Firefox scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) transparent;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Glassmorphism */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }

        /* Theme utility classes */
        .theme-bg { background-color: var(--bg-primary); }
        .theme-bg-secondary { background-color: var(--bg-secondary); }
        .theme-bg-tertiary { background-color: var(--bg-tertiary); }
        .theme-card { background-color: var(--card-bg); }
        .theme-text { color: var(--text-primary); }
        .theme-text-secondary { color: var(--text-secondary); }
        .theme-text-tertiary { color: var(--text-tertiary); }
        .theme-border { border-color: var(--border-primary); }
        .theme-border-secondary { border-color: var(--border-secondary); }

        /* Shimmer gradient */
        .shimmer {
            background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.5) 50%, transparent 75%);
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite;
        }

        /* Premium gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Animated gradient background */
        .gradient-bg {
            background: linear-gradient(-45deg, #eef2ff, #e0e7ff, #f5f3ff, #ede9fe);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
        }

        /* Focus ring */
        input:focus, textarea:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* Selection color */
        ::selection {
            background: rgba(99, 102, 241, 0.2);
            color: #312e81;
        }

        /* Smooth page transitions */
        .view-transition {
            animation: fadeIn 0.3s ease-out, slideUp 0.4s ease-out;
        }

        /* Line clamp utility */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Dark-mode fallback for untouched Tailwind utility classes */
        html.dark .bg-white { background-color: var(--card-bg) !important; }
        html.dark .bg-gray-50,
        html.dark .bg-gray-50\/20,
        html.dark .bg-gray-50\/30,
        html.dark .bg-gray-50\/50,
        html.dark .bg-gray-50\/80,
        html.dark .bg-gray-100,
        html.dark .bg-gray-100\/60,
        html.dark .bg-gray-100\/80,
        html.dark .from-gray-50\/80,
        html.dark .to-white {
          background-color: var(--bg-tertiary) !important;
          background-image: none !important;
        }

        html.dark .text-gray-900,
        html.dark .text-gray-800,
        html.dark .text-gray-700 { color: var(--text-primary) !important; }
        html.dark .text-gray-600,
        html.dark .text-gray-500,
        html.dark .text-gray-400 { color: var(--text-secondary) !important; }
        html.dark .text-gray-300,
        html.dark .text-gray-200 { color: var(--text-tertiary) !important; }

        html.dark .border-gray-50,
        html.dark .border-gray-100,
        html.dark .border-gray-100\/50,
        html.dark .border-gray-100\/80,
        html.dark .border-gray-200,
        html.dark .border-gray-200\/60,
        html.dark .border-gray-200\/80,
        html.dark .border-gray-300 {
          border-color: var(--border-secondary) !important;
        }

        html.dark .hover\:bg-gray-50:hover,
        html.dark .hover\:bg-gray-50\/80:hover,
        html.dark .hover\:bg-gray-100:hover,
        html.dark .hover\:bg-gray-200:hover,
        html.dark .hover\:bg-gray-200\/50:hover {
          background-color: var(--hover-bg) !important;
        }

        html.dark .hover\:text-gray-600:hover,
        html.dark .hover\:text-gray-700:hover,
        html.dark .hover\:text-gray-800:hover { color: var(--text-primary) !important; }
    </style>
    <script>
      // Persist theme preference — runs before React to prevent flash
      (function() {
        var saved = localStorage.getItem('lumina_theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
